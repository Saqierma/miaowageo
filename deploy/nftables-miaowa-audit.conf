# 检测 Worker 的入站限制：只有主站服务器能连 4319。
#
# ---------------------------------------------------------------------------
# 为什么云防火墙之外还要再来一层
#
# 云厂商的安全组是一层**你在机器上看不见、也改不了**的配置：控制台上一次
# 误操作就能把端口放开，而机器本身毫无察觉。如果 Worker 与主站之间跑的是
# 明文 HTTP（同区域内网可以这么做），届时唯一的屏障就只剩 Bearer token。
#
# 这一层是纵深防御，不是重复。实测中确实遇到过同一云厂商、同一区域的两台
# 实例，安全组配置一致而实际入站行为不同的情况——**你无法在机器上验证
# 云防火墙此刻是否生效，但你可以验证 nftables 生效**。
#
# ---------------------------------------------------------------------------
# 刻意不写进 /etc/nftables.conf
#
# 那个文件开头通常是 `flush ruleset`。如果机器上还有别的服务用 nftables
# 单独加载规则，往那个文件里加东西再启用 nftables.service，会在开机时把
# 别人的规则整个冲掉。这里用自己的表、自己的 conf、自己的 oneshot 单元。
#
# policy accept + 只匹配 tcp dport 4319：这条链对 SSH（22）和其他任何流量
# 都不产生影响，**不存在把自己锁在门外的可能**。

# 幂等：先确保表存在（不存在则创建空表），再删除，然后重新定义。
table inet miaowa_audit_fw
delete table inet miaowa_audit_fw

table inet miaowa_audit_fw {
	chain input {
		type filter hook input priority 0; policy accept;

		# 本机自测（curl 127.0.0.1:4319）必须放行，否则部署验证做不了。
		iif "lo" accept

		# ↓↓↓ 部署时改成你主站服务器的公网 IP ↓↓↓
		# 唯一合法的调用方。换 IP 时这里和主站侧配置要同时改。
		tcp dport 4319 ip saddr 203.0.113.1 accept

		# 其余一律丢弃（drop 而非 reject：不给扫描者「这里有东西」的回执）。
		tcp dport 4319 drop
	}
}
